# מפעיל את /api/cron/tick כל 5 דקות — תזכורות בשעה המדויקת גם בתוכנית Vercel Hobby
# (שם Cron רץ רק פעם ביום). דורש Secret בשם CRON_SECRET בהגדרות הריפו (אותו ערך כמו ב-Vercel).
# אופציונלי: Variable בשם APP_URL אם הכתובת שונה מברירת המחדל למטה.
name: cron-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL || 'https://my-crm-six-black.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set in the repository settings"; exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
