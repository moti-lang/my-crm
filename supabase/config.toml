project_id = "teichtal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# הרשמה "פתוחה" ברמת GoTrue, כי כניסה ראשונה בגוגל היא טכנית הרשמה.
# מה שסוגר את הדלת הוא הטריגר על auth.users (מיגרציה 0014): אימייל
# שאינו ברשימת המורשים לא מקבל חשבון. ראה 11_allowlist_proof.sql.
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = false          # אין אימייל וסיסמה בכלל — גוגל בלבד

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.wa-send]
verify_jwt = false             # נקראת מ-cron, לא מהדפדפן

[functions.wa-webhook]
verify_jwt = false             # מאומתת בחתימת HMAC של ה-Hub, לא ב-JWT

[functions.cron-wa-health]
verify_jwt = false             # נקראת מ-pg_cron

[functions.cron-lessons]
verify_jwt = false             # נקראת מ-pg_cron

[functions.cron-reminders]
verify_jwt = false

[functions.cron-debt]
verify_jwt = false

[functions.cron-attendance-watch]
verify_jwt = false

[functions.cron-absence]
verify_jwt = false

[functions.cron-summary]
verify_jwt = false

[functions.ai-command]
verify_jwt = true              # נקראת מהמערכת בלבד, לא מהוובהוק הציבורי
