<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול לקוחות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #060b14; font-family: 'Heebo', sans-serif; direction: rtl; color: #f1f5f9; min-height: 100vh; }
input, button { font-family: 'Heebo', sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #1e293b; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
@keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* --- Leaflet: התאמה לערכת הצבעים הכהה ולכיוון RTL --- */
.leaflet-container { background: #060b14; font-family: 'Heebo', sans-serif; }
.leaflet-popup-content-wrapper { background: #0f172a; color: #f1f5f9; border: 1px solid #1e293b; border-radius: 12px; box-shadow: 0 16px 48px #000c; }
.leaflet-popup-content { margin: 14px 16px; direction: rtl; text-align: right; font-size: 13px; line-height: 1.5; }
.leaflet-popup-tip { background: #0f172a; border: 1px solid #1e293b; }
.leaflet-popup-close-button { color: #64748b !important; }
.leaflet-control-zoom a { background: #0f172a !important; color: #94a3b8 !important; border-color: #1e293b !important; }
.leaflet-control-zoom a:hover { background: #1e293b !important; }
.leaflet-control-attribution { background: #0f172acc !important; color: #475569 !important; font-size: 10px; }
.leaflet-control-attribution a { color: #64748b !important; }
.crm-pin { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = "https://millozjbbrafovfghciq.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZYwesip007nxPg3zwGS9_w_Zorkybj6";

const api = async (method, path, body) => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const err = await res.text(); throw new Error(err); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
};

const STATUSES = [
  { label: "לקוח חדש", color: "#94a3b8", bg: "#1e293b", icon: "✦" },
  { label: "שיחה טלפונית", color: "#38bdf8", bg: "#0c2a3b", icon: "✆" },
  { label: "פגישת זום", color: "#a78bfa", bg: "#1e1040", icon: "◈" },
  { label: "אפיון מערכת", color: "#fb923c", bg: "#2d1a07", icon: "◎" },
  { label: "הצעת מחיר", color: "#facc15", bg: "#2d2500", icon: "◆" },
  { label: "נסגרה עסקה", color: "#4ade80", bg: "#062016", icon: "✔" },
];

const PIPELINE = STATUSES.map(s => s.label);
const getStatus = label => STATUSES.find(s => s.label === label) || STATUSES[0];

// --- מפה: המרת כתובת לקואורדינטות דרך Nominatim (OpenStreetMap, ללא מפתח API) ---
const GEOCODE_COUNTRY = "il";   // הטיית תוצאות לישראל. לריק = חיפוש עולמי
const ISRAEL_CENTER = [31.5, 34.9];

const esc = str => String(str ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Supabase עשוי להחזיר float8 כמחרוזת — מנרמלים למספר, ומחזירים null אם אין קואורדינטות
const coordsOf = c => {
  const lat = Number(c?.lat), lng = Number(c?.lng);
  if (c?.lat == null || c?.lng == null || !isFinite(lat) || !isFinite(lng)) return null;
  return [lat, lng];
};

const geocode = async (address) => {
  if (!address || !address.trim()) return { lat: null, lng: null };
  try {
    const params = new URLSearchParams({ format: "json", limit: "1", "accept-language": "he", q: address.trim() });
    if (GEOCODE_COUNTRY) params.set("countrycodes", GEOCODE_COUNTRY);
    const res = await fetch(`https://nominatim.openstreetmap.org/search?${params}`);
    if (!res.ok) return { lat: null, lng: null };
    const data = await res.json();
    if (!data.length) return { lat: null, lng: null };
    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch (e) {
    return { lat: null, lng: null };
  }
};

function StatusBadge({ status, small }) {
  const s = getStatus(status);
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:"5px", background:s.bg, color:s.color, border:`1px solid ${s.color}33`, borderRadius:"6px", padding:small?"2px 8px":"4px 12px", fontSize:small?"11px":"12px", fontWeight:600, whiteSpace:"nowrap" }}>
      {s.icon} {status}
    </span>
  );
}

function ProgressBar({ status }) {
  const idx = PIPELINE.indexOf(status);
  const pct = ((idx + 1) / PIPELINE.length) * 100;
  const s = getStatus(status);
  return (
    <div style={{ width:"100%", height:"3px", background:"#1e293b", borderRadius:"2px", overflow:"hidden" }}>
      <div style={{ height:"100%", width:`${pct}%`, background:s.color, borderRadius:"2px", transition:"width 0.4s ease", boxShadow:`0 0 6px ${s.color}88` }} />
    </div>
  );
}

function Modal({ client, onSave, onClose }) {
  const [form, setForm] = React.useState(client || { name:"", phone:"", address:"", status:STATUSES[0].label });
  const [errors, setErrors] = React.useState({});
  const [saving, setSaving] = React.useState(false);

  const handleSubmit = async () => {
    const e = {};
    if (!form.name.trim()) e.name = "שם חובה";
    if (!form.phone.trim()) e.phone = "טלפון חובה";
    if (Object.keys(e).length) { setErrors(e); return; }
    setSaving(true);
    await onSave(form);
    setSaving(false);
  };

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"#00000099", display:"flex", alignItems:"center", justifyContent:"center", zIndex:100, backdropFilter:"blur(4px)" }}>
      <div onClick={e => e.stopPropagation()} style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:"16px", padding:"32px", width:"min(420px,92vw)", boxShadow:"0 24px 80px #000a", direction:"rtl" }}>
        <h2 style={{ margin:"0 0 24px", fontSize:"18px", fontWeight:700, color:"#f1f5f9" }}>{client ? "עריכת לקוח" : "לקוח חדש"}</h2>
        {[{key:"name",label:"שם לקוח",type:"text",placeholder:"ישראל ישראלי"},
          {key:"phone",label:"מספר טלפון",type:"tel",placeholder:"050-0000000"},
          {key:"address",label:"כתובת",type:"text",placeholder:"הרצל 12, תל אביב",hint:"אופציונלי — משמש להצגת הלקוח על המפה"}
         ].map(({key,label,type,placeholder,hint}) => (
          <div key={key} style={{ marginBottom:"16px" }}>
            <label style={{ display:"block", fontSize:"12px", color:"#64748b", marginBottom:"6px", fontWeight:600 }}>{label}</label>
            <input type={type} value={form[key] || ""} placeholder={placeholder}
              onChange={e => { setForm({...form,[key]:e.target.value}); setErrors({...errors,[key]:""}); }}
              style={{ width:"100%", background:"#1e293b", border:`1px solid ${errors[key]?"#f87171":"#334155"}`, borderRadius:"8px", padding:"10px 12px", color:"#f1f5f9", fontSize:"14px", outline:"none" }} />
            {errors[key] && <p style={{ margin:"4px 0 0", color:"#f87171", fontSize:"11px" }}>{errors[key]}</p>}
            {hint && !errors[key] && <p style={{ margin:"4px 0 0", color:"#334155", fontSize:"11px" }}>{hint}</p>}
          </div>
        ))}
        <div style={{ marginBottom:"24px" }}>
          <label style={{ display:"block", fontSize:"12px", color:"#64748b", marginBottom:"6px", fontWeight:600 }}>מצב הזמנה</label>
          <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
            {STATUSES.map(s => (
              <button key={s.label} onClick={() => setForm({...form,status:s.label})}
                style={{ padding:"6px 12px", borderRadius:"6px", fontSize:"12px", cursor:"pointer", fontWeight:600, background:form.status===s.label?s.bg:"transparent", color:form.status===s.label?s.color:"#475569", border:`1px solid ${form.status===s.label?s.color+"66":"#1e293b"}` }}>
                {s.icon} {s.label}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display:"flex", gap:"10px" }}>
          <button onClick={handleSubmit} disabled={saving}
            style={{ padding:"10px 24px", borderRadius:"8px", border:"none", background:saving?"#334155":"linear-gradient(135deg,#3b82f6,#6366f1)", color:"#fff", fontWeight:700, fontSize:"14px", cursor:"pointer" }}>
            {saving?"שומר...":client?"שמור שינויים":"הוסף לקוח"}
          </button>
          <button onClick={onClose} style={{ padding:"10px 18px", borderRadius:"8px", border:"1px solid #334155", background:"transparent", color:"#64748b", fontWeight:600, fontSize:"14px", cursor:"pointer" }}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

function QuickStatusPicker({ client, onUpdate, onClose }) {
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:99, display:"flex", alignItems:"center", justifyContent:"center", background:"#00000055" }}>
      <div onClick={e => e.stopPropagation()} style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:"12px", padding:"16px", minWidth:"220px", direction:"rtl", boxShadow:"0 16px 48px #000c" }}>
        <p style={{ margin:"0 0 12px", fontSize:"12px", color:"#64748b", fontWeight:600 }}>עדכן מצב</p>
        {STATUSES.map((st, i) => (
          <button key={st.label} onClick={() => { onUpdate(st.label); onClose(); }}
            style={{ display:"flex", alignItems:"center", gap:"8px", width:"100%", padding:"8px 10px", borderRadius:"6px", border:"none", cursor:"pointer", background:client.status===st.label?st.bg:"transparent", color:client.status===st.label?st.color:"#94a3b8", fontSize:"13px", fontWeight:client.status===st.label?700:500 }}>
            {st.icon} {st.label}
            {i === PIPELINE.indexOf(client.status) && <span style={{ marginRight:"auto", color:st.color }}>✓</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

function MapView({ clients, onEdit }) {
  const containerRef = React.useRef(null);
  const mapRef = React.useRef(null);
  const layerRef = React.useRef(null);
  const editRef = React.useRef(onEdit);
  editRef.current = onEdit;

  // אתחול המפה פעם אחת בלבד — Leaflet מנהל את ה-DOM שלו בעצמו
  React.useEffect(() => {
    if (mapRef.current || !containerRef.current) return;
    const map = L.map(containerRef.current, { attributionControl: true }).setView(ISRAEL_CENTER, 7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd", maxZoom: 19,
    }).addTo(map);
    layerRef.current = L.layerGroup().addTo(map);
    mapRef.current = map;
    // הקונטיינר נמדד לפני שהוא מקבל גובה סופי — מכריחים חישוב מחדש
    const t = setTimeout(() => map.invalidateSize(), 0);
    const onResize = () => map.invalidateSize();
    window.addEventListener("resize", onResize);
    return () => { clearTimeout(t); window.removeEventListener("resize", onResize); map.remove(); mapRef.current = null; };
  }, []);

  // סנכרון הסיכות מול רשימת הלקוחות המסוננת
  React.useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const points = [];
    clients.forEach(client => {
      const pos = coordsOf(client);
      if (!pos) return;
      const s = getStatus(client.status);
      const icon = L.divIcon({
        className: "",
        html: `<div class="crm-pin" style="background:${s.bg};color:${s.color};border:2px solid ${s.color};box-shadow:0 0 10px ${s.color}66">${s.icon}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16],
      });
      const marker = L.marker(pos, { icon, title: client.name }).addTo(layer);
      marker.bindPopup(`
        <div style="font-weight:700;font-size:14px;margin-bottom:6px">${esc(client.name)}</div>
        <div style="display:inline-flex;align-items:center;gap:5px;background:${s.bg};color:${s.color};border:1px solid ${s.color}33;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;margin-bottom:8px">${s.icon} ${esc(client.status)}</div>
        <div style="color:#94a3b8;margin-top:6px"><a href="tel:${esc(client.phone)}" style="color:#60a5fa;text-decoration:none">${esc(client.phone)}</a></div>
        <div style="color:#64748b;font-size:12px;margin-top:2px">${esc(client.address || "")}</div>
        <button data-crm-edit="1" style="margin-top:10px;padding:5px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer">עריכה</button>
      `);
      marker.on("popupopen", e => {
        const btn = e.popup.getElement()?.querySelector("[data-crm-edit]");
        if (btn) btn.onclick = () => { map.closePopup(); editRef.current(client); };
      });
      points.push(pos);
    });
    if (points.length) map.fitBounds(points, { padding: [50, 50], maxZoom: 14 });
  }, [clients]);

  return <div ref={containerRef} style={{ width:"100%", height:"min(70vh,620px)", borderRadius:"12px", border:"1px solid #1e293b", overflow:"hidden" }} />;
}

function App() {
  const [clients, setClients] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [modal, setModal] = React.useState(null);
  const [quickPick, setQuickPick] = React.useState(null);
  const [search, setSearch] = React.useState("");
  const [filterStatus, setFilterStatus] = React.useState("הכל");
  const [toast, setToast] = React.useState(null);
  const [view, setView] = React.useState("list");
  const [backfilling, setBackfilling] = React.useState(false);

  const showToast = (msg, error) => { setToast({msg,error}); setTimeout(() => setToast(null), 3000); };

  const loadClients = async () => {
    try {
      const data = await api("GET", "/clients?order=created_at.desc");
      setClients(data || []);
    } catch(e) { showToast("שגיאה בטעינת הנתונים", true); }
    finally { setLoading(false); }
  };

  React.useEffect(() => { loadClients(); }, []);

  const handleSave = async (form) => {
    const address = (form.address || "").trim();
    const prev = modal?.mode === "edit" ? modal.client : null;
    // ממירים כתובת לקואורדינטות רק כשהיא חדשה או השתנתה, כדי לא להעמיס על Nominatim
    let geo = { lat: prev?.lat ?? null, lng: prev?.lng ?? null };
    if (!address) geo = { lat: null, lng: null };
    else if (!prev || (prev.address || "").trim() !== address || coordsOf(prev) === null) geo = await geocode(address);

    const payload = { name:form.name, phone:form.phone, status:form.status, address:address || null, lat:geo.lat, lng:geo.lng };
    try {
      if (prev) {
        await api("PATCH", `/clients?id=eq.${prev.id}`, payload);
        setClients(clients.map(c => c.id === prev.id ? {...c, ...payload} : c));
      } else {
        const created = await api("POST", "/clients", payload);
        setClients([created[0], ...clients]);
      }
      setModal(null);
      if (address && geo.lat == null) showToast("נשמר, אך לא נמצאה הכתובת על המפה", true);
      else showToast(prev ? "הלקוח עודכן ✓" : "לקוח חדש נוסף ✓");
    } catch(e) {
      showToast(/address|lat|lng/i.test(String(e.message)) ? "חסרות עמודות address/lat/lng בטבלה — ראה README" : "שגיאה בשמירה", true);
    }
  };

  // השלמת קואורדינטות ללקוחות שיש להם כתובת אך טרם מופו (Nominatim מוגבל לפנייה אחת לשנייה)
  const missingCoords = clients.filter(c => (c.address || "").trim() && !coordsOf(c));

  const backfillCoords = async () => {
    setBackfilling(true);
    let ok = 0;
    for (const client of missingCoords) {
      const geo = await geocode(client.address);
      if (geo.lat != null) {
        try {
          await api("PATCH", `/clients?id=eq.${client.id}`, { lat:geo.lat, lng:geo.lng });
          setClients(cs => cs.map(c => c.id === client.id ? {...c, ...geo} : c));
          ok++;
        } catch(e) { /* ממשיכים ליתר הלקוחות */ }
      }
      await new Promise(r => setTimeout(r, 1100));
    }
    setBackfilling(false);
    showToast(ok ? `${ok} כתובות מופו ✓` : "לא נמצאו כתובות מתאימות", !ok);
  };

  const handleDelete = async (id) => {
    if (!confirm("למחוק לקוח זה?")) return;
    try {
      await api("DELETE", `/clients?id=eq.${id}`);
      setClients(clients.filter(c => c.id !== id));
      showToast("הלקוח הוסר");
    } catch(e) { showToast("שגיאה במחיקה", true); }
  };

  const handleStatusUpdate = async (id, newStatus) => {
    try {
      await api("PATCH", `/clients?id=eq.${id}`, { status:newStatus });
      setClients(clients.map(c => c.id === id ? {...c,status:newStatus} : c));
      showToast("מצב עודכן ✓");
    } catch(e) { showToast("שגיאה בעדכון", true); }
  };

  const filtered = clients.filter(c => {
    const matchSearch = c.name.includes(search) || c.phone.includes(search) || (c.address || "").includes(search);
    const matchFilter = filterStatus === "הכל" || c.status === filterStatus;
    return matchSearch && matchFilter;
  });

  const stats = STATUSES.map(s => ({ ...s, count:clients.filter(c => c.status===s.label).length }));

  return (
    <div style={{ minHeight:"100vh", background:"#060b14", direction:"rtl", color:"#f1f5f9" }}>
      <div style={{ borderBottom:"1px solid #1e293b", padding:"20px 28px", display:"flex", alignItems:"center", justifyContent:"space-between", background:"#080e1a" }}>
        <div>
          <h1 style={{ margin:0, fontSize:"20px", fontWeight:800, color:"#f8fafc" }}><span style={{ color:"#3b82f6" }}>◈</span> ניהול לקוחות</h1>
          <p style={{ margin:"2px 0 0", fontSize:"12px", color:"#475569" }}>{loading?"טוען...":`${clients.length} לקוחות במערכת`}</p>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:"10px", flexWrap:"wrap" }}>
          <div style={{ display:"flex", background:"#0f172a", border:"1px solid #1e293b", borderRadius:"8px", padding:"3px" }}>
            {[{key:"list",label:"☰ רשימה"},{key:"map",label:"🗺 מפה"}].map(v => (
              <button key={v.key} onClick={() => setView(v.key)}
                style={{ padding:"6px 14px", borderRadius:"6px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:700, background:view===v.key?"#1e293b":"transparent", color:view===v.key?"#60a5fa":"#475569" }}>{v.label}</button>
            ))}
          </div>
          <button onClick={() => setModal({mode:"add"})} style={{ padding:"9px 18px", borderRadius:"8px", border:"none", background:"linear-gradient(135deg,#3b82f6,#6366f1)", color:"#fff", fontWeight:700, fontSize:"13px", cursor:"pointer", boxShadow:"0 4px 16px #3b82f633" }}>+ לקוח חדש</button>
        </div>
      </div>

      <div style={{ padding:"16px 28px", display:"flex", gap:"8px", overflowX:"auto", borderBottom:"1px solid #1e293b" }}>
        <button onClick={() => setFilterStatus("הכל")} style={{ padding:"6px 14px", borderRadius:"6px", border:`1px solid ${filterStatus==="הכל"?"#3b82f6":"#1e293b"}`, background:filterStatus==="הכל"?"#1e3a5f":"transparent", color:filterStatus==="הכל"?"#60a5fa":"#475569", fontWeight:600, fontSize:"12px", cursor:"pointer", whiteSpace:"nowrap" }}>הכל ({clients.length})</button>
        {stats.map(s => (
          <button key={s.label} onClick={() => setFilterStatus(s.label)} style={{ padding:"6px 14px", borderRadius:"6px", border:`1px solid ${filterStatus===s.label?s.color+"66":"#1e293b"}`, background:filterStatus===s.label?s.bg:"transparent", color:filterStatus===s.label?s.color:"#475569", fontWeight:600, fontSize:"12px", cursor:"pointer", whiteSpace:"nowrap" }}>{s.icon} {s.label} ({s.count})</button>
        ))}
      </div>

      <div style={{ padding:"16px 28px" }}>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="🔍  חיפוש לפי שם, טלפון או כתובת..."
          style={{ width:"min(360px,100%)", background:"#1e293b", border:"1px solid #334155", borderRadius:"8px", padding:"9px 14px", color:"#f1f5f9", fontSize:"13px", outline:"none" }} />
      </div>

      <div style={{ padding:"0 28px 40px" }}>
        {loading && <div style={{ textAlign:"center", padding:"60px 0", color:"#334155" }}><p style={{ fontSize:"14px" }}>טוען נתונים מהענן...</p></div>}

        {!loading && view === "map" && (
          <React.Fragment>
            {missingCoords.length > 0 && (
              <div style={{ display:"flex", alignItems:"center", gap:"12px", flexWrap:"wrap", background:"#2d2500", border:"1px solid #facc1533", borderRadius:"10px", padding:"10px 14px", marginBottom:"12px" }}>
                <span style={{ fontSize:"12px", color:"#facc15", fontWeight:600 }}>◆ {missingCoords.length} לקוחות עם כתובת שטרם מופתה</span>
                <button onClick={backfillCoords} disabled={backfilling}
                  style={{ padding:"5px 12px", borderRadius:"6px", border:"1px solid #facc1544", background:backfilling?"#1e293b":"#facc1518", color:backfilling?"#475569":"#facc15", fontWeight:700, fontSize:"11px", cursor:backfilling?"default":"pointer" }}>
                  {backfilling ? "ממפה..." : "מפה אותם עכשיו"}
                </button>
              </div>
            )}
            <MapView clients={filtered} onEdit={client => setModal({mode:"edit",client})} />
            <div style={{ display:"flex", gap:"14px", flexWrap:"wrap", marginTop:"12px" }}>
              {STATUSES.map(s => (
                <span key={s.label} style={{ display:"inline-flex", alignItems:"center", gap:"6px", fontSize:"11px", color:"#475569", fontWeight:600 }}>
                  <span style={{ display:"inline-block", width:"10px", height:"10px", borderRadius:"50%", background:s.color }} /> {s.label}
                </span>
              ))}
            </div>
            <p style={{ margin:"10px 0 0", fontSize:"11px", color:"#334155" }}>
              מוצגים {filtered.filter(c => coordsOf(c)).length} מתוך {filtered.length} לקוחות מסוננים. לקוח ללא כתובת לא מופיע על המפה.
            </p>
          </React.Fragment>
        )}

        {!loading && view === "list" && filtered.length === 0 && <div style={{ textAlign:"center", padding:"60px 0", color:"#334155" }}><div style={{ fontSize:"36px", marginBottom:"8px" }}>◎</div><p style={{ fontSize:"14px" }}>לא נמצאו לקוחות</p></div>}
        {view === "list" && filtered.map(client => {
          const s = getStatus(client.status);
          const idx = PIPELINE.indexOf(client.status);
          return (
            <div key={client.id} style={{ background:"#0c1525", border:"1px solid #1e293b", borderRadius:"12px", padding:"16px 18px", marginBottom:"10px" }}>
              <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:"12px", flexWrap:"wrap" }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"6px", flexWrap:"wrap" }}>
                    <span style={{ fontWeight:700, fontSize:"15px", color:"#f1f5f9" }}>{client.name}</span>
                    <StatusBadge status={client.status} small />
                  </div>
                  <p style={{ margin:"0 0 4px", fontSize:"13px", color:"#64748b" }}>{client.phone}</p>
                  {client.address && (
                    <p style={{ margin:"0 0 10px", fontSize:"12px", color:coordsOf(client)?"#475569":"#78350f" }}>
                      ⌖ {client.address}{!coordsOf(client) && " (לא אותרה על המפה)"}
                    </p>
                  )}
                  {!client.address && <div style={{ height:"10px" }} />}
                  <ProgressBar status={client.status} />
                  <p style={{ margin:"4px 0 0", fontSize:"11px", color:"#334155" }}>שלב {idx+1} מתוך {PIPELINE.length}</p>
                </div>
                <div style={{ display:"flex", gap:"6px", alignItems:"center", flexShrink:0, flexWrap:"wrap" }}>
                  {idx < PIPELINE.length-1 && (
                    <button onClick={() => handleStatusUpdate(client.id, PIPELINE[idx+1])} style={{ padding:"6px 10px", borderRadius:"6px", border:`1px solid ${s.color}44`, background:s.bg, color:s.color, fontWeight:700, fontSize:"11px", cursor:"pointer", whiteSpace:"nowrap" }}>◀ {PIPELINE[idx+1]}</button>
                  )}
                  <button onClick={() => setQuickPick(client.id)} style={{ padding:"6px 10px", borderRadius:"6px", border:"1px solid #1e293b", background:"#1e293b", color:"#94a3b8", fontSize:"12px", cursor:"pointer" }}>⇅</button>
                  <button onClick={() => setModal({mode:"edit",client})} style={{ padding:"6px 10px", borderRadius:"6px", border:"1px solid #1e293b", background:"#1e293b", color:"#94a3b8", fontSize:"12px", cursor:"pointer" }}>עריכה</button>
                  <button onClick={() => handleDelete(client.id)} style={{ padding:"6px 10px", borderRadius:"6px", border:"1px solid #1e293b", background:"transparent", color:"#475569", fontSize:"12px", cursor:"pointer" }}>✕</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {modal && <Modal client={modal.mode==="edit"?modal.client:null} onSave={handleSave} onClose={() => setModal(null)} />}
      {quickPick && <QuickStatusPicker client={clients.find(c => c.id===quickPick)} onUpdate={status => handleStatusUpdate(quickPick,status)} onClose={() => setQuickPick(null)} />}
      {toast && (
        <div style={{ position:"fixed", bottom:"24px", left:"50%", transform:"translateX(-50%)", background:toast.error?"#1a0a0a":"#1e293b", border:`1px solid ${toast.error?"#f87171":"#334155"}`, borderRadius:"8px", padding:"10px 20px", color:toast.error?"#f87171":"#4ade80", fontWeight:600, fontSize:"13px", zIndex:200, animation:"fadeUp 0.3s ease" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
