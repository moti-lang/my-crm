# פריסת הפרונט. ה-backend כולו בסופבייס.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ★ ניתוב SPA. בלי זה כל כתובת שאינה "/" מחזירה 404 —
# כולל /a/:token, הקישור שהאחראית מקבלת בוואטסאפ.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ★ כותרות אבטחה (ביקורת 11/2026). ה-CSP מתיר רק את מה שהאפליקציה באמת טוענת:
#   סקריפטים — מהאתר בלבד (אין סקריפט inline ואין eval בבילד);
#   סגנונות — מהאתר + Google Fonts. 'unsafe-inline' לסגנונות בלבד: React מצייר style="…",
#     וחלון ההדפסה/PDF כותב <style> משלו (export-core.ts);
#   גופנים — fonts.gstatic.com; תמונות — data:/blob: (ה-QR של וואטסאפ, הייצוא);
#   חיבורים — רק לפרויקט ה-Supabase של המערכת (REST, Auth, Edge Functions).
# ההתחברות בגוגל היא ניווט (redirect), לא fetch — CSP לא חוסם אותה.
# שינוי כאן: הבדיקות בדפדפן (supabase/tests/_ui.mjs) מגישות את האפליקציה עם אותו CSP,
# וכל הפרה נרשמת כשגיאת דף — מסך שנשבר בגללו מפיל את הבדיקה.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://kzoxlusbocxjinfxckhe.supabase.co wss://kzoxlusbocxjinfxckhe.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# נכסים עם hash בשם — אפשר לשמור לנצח
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ה-HTML עצמו לעולם לא נשמר במטמון, אחרת פריסה חדשה לא מגיעה
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
